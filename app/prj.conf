# doesnt need anything because we are using the default configuration from the board
# CONFIG_COMPILER_OPT="-mlongcalls"

# Core kernel + logging/print
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_STDOUT_CONSOLE=y  

# GPIO (for LED blink)
CONFIG_GPIO=y

# UART console (needed for printk over serial)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y


CONFIG_ADC=y
CONFIG_ADC_STM32=y      # or CONFIG_ADC_3=y depending on DTS
