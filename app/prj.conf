# doesnt need anything because we are using the default configuration from the board
# CONFIG_COMPILER_OPT="-mlongcalls"

# Core kernel + logging/print
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# GPIO (for LED blink)
CONFIG_GPIO=y

# UART console (needed for printk over serial)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# SPI for LCD display
CONFIG_SPI=y

# Display drivers - DISABLED (ILI9340 driver incompatible, will use custom SPI)
# CONFIG_DISPLAY=y
# CONFIG_ILI9340=y